# quorum=2, 초기 모니터 대상은 redis-0. 페일오버 시 Sentinel이 새 master를 앱에 알려줌.
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: redis-sentinel

spec:
  serviceName: redis-sentinel-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: hangeul-chat-redis-sentinel
  template:
    metadata:
      labels:
        app: hangeul-chat-redis-sentinel
    spec:
      securityContext:
        fsGroup: 1001
      initContainers:
        - name: check-secret-wait-master
          image: docker.io/busybox:1.36
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: redis-secret
          command:
            - sh
            - -c
            - |
              set -e
              if [ -z "$REDIS_PASSWORD" ]; then echo "check-secret-wait-master: REDIS_PASSWORD is empty"; exit 1; fi
              i=0
              while [ "$i" -lt 120 ]; do
                if nc -z redis-0.redis-headless 6379 2>/dev/null; then exit 0; fi
                echo "waiting for redis-0.redis-headless:6379 ($i)..."
                i=$((i + 1))
                sleep 2
              done
              echo "timeout waiting for Redis master"
              exit 1
      containers:
        - name: redis-sentinel
          image: docker.io/bitnamilegacy/redis-sentinel:7.4.3-debian-12-r0
          imagePullPolicy: IfNotPresent
          ports:
            - name: sentinel
              containerPort: 26379
          env:
            - name: REDIS_MASTER_HOST
              value: redis-0.redis-headless
            - name: REDIS_MASTER_PORT_NUMBER
              value: "6379"
            - name: REDIS_MASTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: REDIS_MASTER_SET
              value: mymaster
            - name: REDIS_SENTINEL_QUORUM
              value: "2"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command:
            - /bin/bash
            - -ec
            - |
              export REDIS_SENTINEL_ANNOUNCE_IP="${POD_IP}"
              exec /opt/bitnami/scripts/redis-sentinel/entrypoint.sh /opt/bitnami/scripts/redis-sentinel/run.sh
          volumeMounts:
            - name: data
              mountPath: /bitnami/redis-sentinel
          startupProbe:
            tcpSocket:
              port: sentinel
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/bitnami/redis/bin/redis-cli -h 127.0.0.1 -p 26379 ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/bitnami/redis/bin/redis-cli -h 127.0.0.1 -p 26379 ping
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: data
          emptyDir: {}