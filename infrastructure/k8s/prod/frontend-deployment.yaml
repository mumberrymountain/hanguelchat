apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment

spec:
  replicas: 3
  selector:
    matchLabels:
      app: hangeul-chat-frontend
  
  template:
    metadata:
      labels: 
        app: hangeul-chat-frontend
    spec:
      imagePullSecrets:
        - name: ecr-registry
      containers:
        - name: hangeul-chat-frontend
          image: 942883569368.dkr.ecr.ap-northeast-2.amazonaws.com/hangeul-chat-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000