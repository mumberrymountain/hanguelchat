apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mysql

spec:
  serviceName: mysql-headless
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: hangeul-chat-mysql
  template:
    metadata:
      labels:
        app: hangeul-chat-mysql
    spec:
      securityContext:
        fsGroup: 1001
      initContainers:
        - name: check-mysql-secret
          image: docker.io/busybox:1.36
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: mysql-secret
          command:
            - sh
            - -c
            - |
              set -e
              if [ -z "$MARIADB_ROOT_PASSWORD" ]; then echo "check-mysql-secret: MARIADB_ROOT_PASSWORD is empty"; exit 1; fi
              if [ -z "$MARIADB_REPLICATION_PASSWORD" ]; then echo "check-mysql-secret: MARIADB_REPLICATION_PASSWORD is empty"; exit 1; fi
              if [ -z "$MARIADB_PASSWORD" ]; then echo "check-mysql-secret: MARIADB_PASSWORD is empty"; exit 1; fi
      containers:
        - name: mariadb
          image: docker.io/bitnamilegacy/mariadb:11.4.7-debian-12-r2
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-secret
          command:
            - /bin/bash
            - -ec
            - |
              ORD="${HOSTNAME##*-}"
              if [[ "$ORD" == "0" ]]; then
                export MARIADB_REPLICATION_MODE=master
              else
                export MARIADB_REPLICATION_MODE=slave
                export MARIADB_MASTER_HOST="mysql-0.mysql-headless"
                export MARIADB_MASTER_PORT_NUMBER="3306"
                export MARIADB_MASTER_ROOT_USER=root
                export MARIADB_MASTER_ROOT_PASSWORD="$MARIADB_ROOT_PASSWORD"
              fi
              exec /opt/bitnami/scripts/mariadb/entrypoint.sh /opt/bitnami/scripts/mariadb/run.sh
          volumeMounts:
            - name: data
              mountPath: /bitnami/mariadb
            - name: mysql-entrypoint-initdb
              mountPath: /docker-entrypoint-initdb.d
          # exec 프로브는 컨테이너가 이미 죽었을 때 kubelet이 "CONTAINER_EXITED" RPC 오류를 낼 수 있음 → 기동 구간은 TCP만 확인
          startupProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb-admin ping -h 127.0.0.1 -uroot
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 8
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  set -e
                  export MYSQL_PWD="$MARIADB_ROOT_PASSWORD"
                  mariadb-admin ping -h 127.0.0.1 -uroot --silent
                  [[ "${HOSTNAME##*-}" == "0" ]] && exit 0
                  [[ "$(mariadb -h 127.0.0.1 -uroot -Nse \
                    "SELECT IF(Slave_IO_Running='Yes' AND Slave_SQL_Running='Yes' AND COALESCE(Seconds_Behind_Master,0)<=300,1,0) FROM information_schema.slave_status LIMIT 1" \
                    2>/dev/null)" == "1" ]]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: mysql-entrypoint-initdb
          configMap:
            name: mysql-init-config
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
