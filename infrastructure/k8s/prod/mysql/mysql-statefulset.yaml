apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mysql

spec:
  serviceName: mysql-headless
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: hangeul-chat-mysql
  template:
    metadata:
      labels:
        app: hangeul-chat-mysql
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: mariadb
          image: docker.io/bitnamilegacy/mariadb:11.4.7-debian-12-r2
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-secret
          command:
            - /bin/bash
            - -ec
            - |
              ORD="${HOSTNAME##*-}"
              if [[ "$ORD" == "0" ]]; then
                export MARIADB_REPLICATION_MODE=master
              else
                export MARIADB_REPLICATION_MODE=slave
                export MARIADB_MASTER_HOST="mysql-0.mysql-headless"
                export MARIADB_MASTER_PORT_NUMBER="3306"
                export MARIADB_MASTER_ROOT_USER=root
                export MARIADB_MASTER_ROOT_PASSWORD="$MARIADB_ROOT_PASSWORD"
              fi
              exec /opt/bitnami/scripts/mariadb/entrypoint.sh /opt/bitnami/scripts/mariadb/run.sh
          volumeMounts:
            - name: data
              mountPath: /bitnami/mariadb
            - name: mysql-entrypoint-initdb
              mountPath: /docker-entrypoint-initdb.d
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb-admin ping -h 127.0.0.1 -uroot
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb-admin ping -h 127.0.0.1 -uroot
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 8
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  export MYSQL_PWD="$MARIADB_ROOT_PASSWORD"
                  # ping 성공 시 stdout에 "mysqld is alive"가 나와 이벤트만 헷갈리므로 버림
                  mariadb-admin ping -h 127.0.0.1 -uroot --silent >/dev/null 2>&1
                  ORD="${HOSTNAME##*-}"
                  if [[ "$ORD" == "0" ]]; then
                    exit 0
                  fi
                  rep="$(mariadb -h 127.0.0.1 -uroot -Nse \
                    "SELECT IF(Slave_IO_Running='Yes' AND Slave_SQL_Running='Yes' AND COALESCE(Seconds_Behind_Master,0)<=300,1,0) FROM information_schema.slave_status LIMIT 1" \
                    2>/dev/null || true)"
                  if [[ "$rep" == "1" ]]; then
                    exit 0
                  fi
                  echo "readiness: replication not ready (slave_status=${rep:-empty})" >&2
                  exit 1
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: mysql-entrypoint-initdb
          configMap:
            name: mysql-init-config
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
