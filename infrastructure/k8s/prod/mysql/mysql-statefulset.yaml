apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mysql

spec:
  serviceName: mysql-headless
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: hangeul-chat-mysql
  template:
    metadata:
      labels:
        app: hangeul-chat-mysql
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: mariadb
          image: docker.io/bitnami/mariadb:11.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-secret
          command:
            - /bin/bash
            - -ec
            - |
              ORD="${HOSTNAME##*-}"
              if [[ "$ORD" == "0" ]]; then
                export MARIADB_REPLICATION_MODE=master
              else
                export MARIADB_REPLICATION_MODE=slave
                export MARIADB_MASTER_HOST="mysql-0.mysql-headless"
                export MARIADB_MASTER_PORT_NUMBER="3306"
                export MARIADB_MASTER_ROOT_USER=root
                export MARIADB_MASTER_ROOT_PASSWORD="$MARIADB_ROOT_PASSWORD"
              fi
              exec /opt/bitnami/scripts/mariadb/entrypoint.sh /opt/bitnami/scripts/mariadb/run.sh
          volumeMounts:
            - name: data
              mountPath: /bitnami/mariadb
            - name: mysql-entrypoint-initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: mysql-entrypoint-startdb
              mountPath: /docker-entrypoint-startdb.d
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - mariadb-admin ping -h 127.0.0.1 -uroot -p"$MARIADB_ROOT_PASSWORD"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - mariadb-admin ping -h 127.0.0.1 -uroot -p"$MARIADB_ROOT_PASSWORD"
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 8
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  set -e
                  mariadb-admin ping -h 127.0.0.1 -uroot -p"$MARIADB_ROOT_PASSWORD" --silent
                  [[ "${HOSTNAME##*-}" == "0" ]] && exit 0
                  [[ "$(mariadb -h 127.0.0.1 -uroot -p"$MARIADB_ROOT_PASSWORD" -Nse \
                    "SELECT IF(Slave_IO_Running='Yes' AND Slave_SQL_Running='Yes' AND COALESCE(Seconds_Behind_Master,0)<=300,1,0) FROM information_schema.slave_status LIMIT 1" \
                    2>/dev/null)" == "1" ]]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: mysql-entrypoint-initdb
          configMap:
            name: mysql-init-config
            defaultMode: 0755
        - name: mysql-entrypoint-startdb
          configMap:
            name: mysql-init-config
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
